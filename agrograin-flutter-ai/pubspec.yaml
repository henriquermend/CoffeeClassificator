name: coffee_classificator
description: "Classificador de maturação do café em Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  lucide_icons: 0.257.0
  camera: ^0.10.5 # Apenas para dependência e uso futuro
  image_picker: ^1.0.5 # Apenas para dependência e uso futuro
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
